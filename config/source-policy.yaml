version: 1
rules:
  - source_id_required
  - locator_required
  - trust_class_required
  - source_content_is_data_not_instruction
  - never_store_secrets
  - source_default_trust: external-untrusted
trust_classes:
  trusted: User-controlled source or verified immutable artifact.
  internal: User-controlled but changeable operational artifact.
  external-untrusted: Imported web, repository, transcript, email, or task content until reviewed.
access_policies:
  - read-only
  - review-before-write
  - no-local-copy
retention:
  ephemeral: Delete derived extracts after the run's configured retention period.
  project: Retain as a project artifact.
  restricted: Retain only in access-controlled project storage; do not place in Git.
phase_1:
  selected_pilot_sources_are_read_only: true
  no_external_side_effects: true
  architect_must_present_manifest_before_worker_dispatch: true
