version: 2
profile_kit:
  repository_root: profiles/
  declarative_source_of_truth: true
  excluded_runtime_state: [.env, credentials, state_db, logs, caches, sessions, gateway_process_state]
  parity_check: python3 scripts/sync_foundry_profiles.py --check
  gateway_port_check: python3 scripts/check_foundry_gateway_ports.py
profiles:
  foundry-architect:
    purpose: Coordinate intake, corpus mapping, human gates, recovery/invalidation routing, and synthesis.
    toolsets: [terminal, file, skills, kanban]
    local_skills: [context-foundry-architect, goal-loop, kanban-orchestrator, foundry-card-orchestration, foundry-discrepancy-to-delivery, context-foundry-intake, context-foundry-map, context-foundry-synthesis, context-foundry-retrospective]
    repository_access: read_write_private_foundry_repo
    optional_api_server: {host: 127.0.0.1, port: 8643, default_enabled: false}
    prohibitions: [execute_worker_packet, audit_own_output, enable_runtime_automation]
  foundry-worker:
    purpose: Execute one bounded packet or bounded correction and return cited evidence.
    toolsets: [terminal, file, skills, kanban]
    local_skills: [context-foundry-worker, foundry-grounded-recovery, foundry-verified-implementation-delivery, context-foundry-evidence]
    repository_access: read_write_private_foundry_repo
    optional_api_server: {host: 127.0.0.1, port: 8644, default_enabled: false}
    prohibitions: [coordinate_program, expand_packet_scope, self_approve]
  foundry-auditor:
    purpose: Independently validate evidence, citations, recovery claims, and safe reproducibility checks.
    toolsets: [terminal, file, skills, kanban]
    local_skills: [context-foundry-auditor, testing, foundry-recovery-audit, foundry-verified-delivery-audit, context-foundry-evidence-audit]
    repository_access: read_write_private_foundry_repo
    optional_api_server: {host: 127.0.0.1, port: 8645, default_enabled: false}
    prohibitions: [author_worker_evidence, repair_then_pass, self_approve]
