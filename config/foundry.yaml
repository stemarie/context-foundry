version: 3
product: context-foundry
repository: https://github.com/stemarie/context-foundry
scope:
  owns: [profiles, role_local_skills, non_secret_profile_templates, synchronization, validation, documentation, exact_draft_handoff_finalization, exact_draft_handoff_scheduler]
  excludes: [goal_loop_runtime, kanban_dispatch, heartbeats, checkpoints, monitors, gateway_activation, api_server_activation, credentials, external_automation, service_integrations]
recovery_policy:
  status: active_scheduled_exact_handoff_recovery
  owner_roles: [foundry-architect, foundry-worker, foundry-auditor, foundry-watchdog]
  activation: explicit_project_scoped_authorization_granted
  guidance: role_local_recovery_and_evidence_skills
release_coordination:
  target_binding: [repository_slug, checkout_origin_remote, github_rest_target]
  authentication: packet_supplied_nonsecret_helper
  architect_issue_action: create_initial_tracking_issue_only
  worker_delivery_actions: [commits, non_force_direct_main_push, issue_evidence, remote_readback]
  auditor_gates: [candidate, integration, closure]
  closure: closure_auditor_after_independently_audited_direct_main_delivery
roles:
  architect:
    profile: foundry-architect
    skills: [context-foundry-architect, context-foundry-intake, context-foundry-map, context-foundry-synthesis, context-foundry-retrospective, foundry-release-brief]
  worker:
    profile: foundry-worker
    skills: [context-foundry-worker, foundry-grounded-recovery, foundry-verified-implementation-delivery, context-foundry-evidence, foundry-release-delivery]
  auditor:
    profile: foundry-auditor
    skills: [context-foundry-auditor, testing, foundry-recovery-audit, foundry-verified-delivery-audit, context-foundry-evidence-audit, foundry-release-audit]
  watchdog:
    profile: foundry-watchdog
    skills: [foundry-lifecycle-orchestration]
