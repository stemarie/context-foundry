version: 3
product: context-foundry
repository: https://github.com/stemarie/context-foundry
scope:
  owns: [profiles, role_local_skills, non_secret_profile_templates, synchronization, validation, documentation]
  excludes: [goal_loop_runtime, kanban_dispatch, dependency_automation, heartbeats, checkpoints, cron, monitors, gateway_activation, api_server_activation, credentials, external_automation, service_integrations]
recovery_policy:
  status: inactive_not_scheduled
  owner_roles: [foundry-architect, foundry-worker, foundry-auditor]
  activation: explicit_project_scoped_authorization_required
  guidance: role_local_recovery_and_evidence_skills
roles:
  architect:
    profile: foundry-architect
    skills: [context-foundry-architect, context-foundry-intake, context-foundry-map, context-foundry-synthesis, context-foundry-retrospective]
  worker:
    profile: foundry-worker
    skills: [context-foundry-worker, foundry-grounded-recovery, foundry-verified-implementation-delivery, context-foundry-evidence]
  auditor:
    profile: foundry-auditor
    skills: [context-foundry-auditor, testing, foundry-recovery-audit, foundry-verified-delivery-audit, context-foundry-evidence-audit]
